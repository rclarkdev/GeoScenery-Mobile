<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/scenery/tabs/observe"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ scene?.title }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-button color="primary" margin (click)="onVisitScene()" [disabled]="isVisiting">
    {{ isVisiting ? 'Recording...' : 'Visit' }}
  </ion-button>
  <ion-note color="danger" *ngIf="visitError">Unable to record this visit.</ion-note>
</ion-content>
