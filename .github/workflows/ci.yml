name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore GeoScenery.sln
      - name: Build
        run: dotnet build GeoScenery.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test GeoScenery.Tests/GeoScenery.Tests.csproj --no-build --configuration Release --logger "console;verbosity=minimal"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ClientApp/package-lock.json
      - name: Install dependencies
        working-directory: ClientApp
        run: npm ci
      - name: Test
        working-directory: ClientApp
        run: npm test -- --watch=false --browsers=ChromeHeadless
      - name: Production build
        working-directory: ClientApp
        run: npm run build -- --configuration production