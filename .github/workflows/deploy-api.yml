name: Deploy API to Azure App Service

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore GeoScenery.sln
      - name: Test
        run: dotnet test GeoScenery.Tests/GeoScenery.Tests.csproj --configuration Release --logger "console;verbosity=minimal"
      - name: Publish API
        run: dotnet publish GeoScenery.Api/GeoScenery.Api.csproj --configuration Release --output ./publish
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ./publish
      - name: Verify readiness
        run: curl --fail --retry 10 --retry-delay 5 "https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/health/ready"